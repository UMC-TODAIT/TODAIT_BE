name: Validate and Deploy Dev

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission
        run: chmod +x gradlew

      # DB/Redis test environment is not configured yet, so compile first.
      - name: Compile application
        run: ./gradlew clean compileJava --no-daemon

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_PORT: ${{ vars.EC2_PORT }}
      EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_PORT"
          test -n "$EC2_KNOWN_HOSTS"
          test -n "$EC2_SSH_PRIVATE_KEY"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/todait.pem
          chmod 600 ~/.ssh/todait.pem
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/todait.pem \
            -p "$EC2_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/todait
          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

          test -f .env

          docker compose \
            -p todait \
            --env-file .env \
            -f compose.deploy.yaml \
            config -q

          docker compose \
            -p todait \
            --env-file .env \
            -f compose.deploy.yaml \
            up -d --build --remove-orphans

          docker compose \
            -p todait \
            -f compose.deploy.yaml \
            ps

          curl \
            --fail \
            --retry 20 \
            --retry-delay 3 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8080/v3/api-docs > /dev/null
          REMOTE
