name: Validate and Deploy Dev

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission
        run: chmod +x gradlew

      # DB/Redis test environment is not configured yet, so compile first.
      - name: Compile application
        run: ./gradlew clean compileJava --no-daemon

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BRANCH: ${{ inputs.branch }}

    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          test -n "$AWS_REGION"
          test -n "$EC2_INSTANCE_ID"
          [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          PARAMETERS=$(jq -nc \
            --arg branch "$DEPLOY_BRANCH" \
            '{commands: [
              "set -eu",
              "cd /opt/todait",
              ("git pull --ff-only origin " + $branch),
              "docker compose up -d --build",
              "docker compose ps",
              "curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://127.0.0.1:8080/v3/api-docs > /dev/null"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TODAIT dev $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
